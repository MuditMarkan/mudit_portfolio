# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - Muditportfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"

      # Install dependencies from the API folder
      - name: Install API dependencies
        working-directory: ./api
        run: npm install

      # There is currently no build step required for your
      # plain HTML/CSS/JavaScript frontend or Express API.
      - name: Verify Node.js application
        working-directory: ./api
        run: node --check server.js

      # Upload the complete repository because the frontend
      # lives at the repository root and the API lives in /api.
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !.git
            !.github

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DA0A390F486A48939757678BCAABB905 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CAC4BFFA219C416FBECDAE637B61C44B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_69F942ECFFB041DE849043F7E330D216 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Muditportfolio"
          slot-name: "Production"
          package: .
